# Version-update PRs (alerts are enabled separately). Weekly, minor+patch
# grouped per ecosystem to keep PR noise low; majors stay individual PRs.
# The labels exclude these PRs from release notes (.github/release.yml).
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "skip-changelog"]
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "skip-changelog"]
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "skip-changelog"]
