[project]
name = "palmimo-portal"
version = "0.1.3"
description = "Palmimo Portal — the device-hosted setup and dashboard web app"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "dbus-fast>=5.0.22",
    "fastapi>=0.141.1",
    "itsdangerous>=2.2.0",
    "uvicorn[standard]>=0.52.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["palmimo_portal"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.8,<2",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23",
    "ruff>=0.3,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
markers = [
    "live: requires a real comitup D-Bus service on the system bus; skipped unless --live is passed (see tests/conftest.py)",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".venv",
    "__pycache__",
    "frontend",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors (PEP-8)
    "W",      # pycodestyle warnings (PEP-8)
    "F",      # Pyflakes (logic error detection)
    "I",      # isort (import ordering)
    "N",      # pep8-naming (naming conventions)
    "UP",     # pyupgrade (update to modern Python syntax)
    "B",      # flake8-bugbear (bug-prone patterns)
    "C4",     # flake8-comprehensions (comprehension optimization)
    "SIM",    # flake8-simplify (code simplification)
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line-too-long (controlled by line-length instead)
    "E741",   # ambiguous variable name (l, O, I, etc. - allowed in math expressions)
    "E402",   # module-import-not-at-top (allows imports after sys.path manipulation)
    "N806",   # non-lowercase-variable-in-function (allows uppercase matrix variables)
    "B008",   # function-call-in-default-argument (needed for Pydantic, etc.)
    "RUF001", # ambiguous-unicode-character-string (the robot speaks Japanese)
    "RUF002", # ambiguous-unicode-character-docstring (en dash, minus sign, and › in English prose)
    "RUF003", # ambiguous-unicode-character-comment (same typography as docstrings)
]

[tool.ruff.lint.isort]
known-first-party = ["palmimo_portal"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = false  # disabled because untyped third-party stubs make some calls return Any
warn_unused_configs = true
# AGENTS.md requires type hints on all function signatures.
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
explicit_package_bases = true
namespace_packages = true
# Suppress errors when a third-party library has no type stubs. Checked with
# this OFF: the untyped set is a long tail, not a small/stable one.
ignore_missing_imports = true
# Target directories
files = [
    "palmimo_portal/",
    "tests/",
]
exclude = [
    "\\.venv",
]
